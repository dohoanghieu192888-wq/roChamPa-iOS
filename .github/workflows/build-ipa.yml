name: NroChamPa

'on':
workflow_dispatch:
push:
branches:
- main
- master

jobs:
build:
runs-on: macos-14
timeout-minutes: 120
steps:
- name: Checkout
uses: actions/checkout@v4
with:
lfs: true

  - name: Select Xcode
    run: |
      set -e
      if [ -d "/Applications/Xcode_15.4.app/Contents/Developer" ]; then
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      fi
      xcodebuild -version

  - name: Build unsigned IPA
    env:
      APP_NAME: NroChamPa
      IPA_NAME: NroChamPa.ipa
      PROJECT: Unity-iPhone.xcodeproj
      SCHEME: Unity-iPhone
      CONFIG: Release
      OUT_DIR: build
    run: bash scripts/build-ipa.sh

  - name: Verify IPA
    run: |
      set -e
      test -s build/NroChamPa.ipa
      unzip -t build/NroChamPa.ipa

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: NroChamPa
      path: build/NroChamPa.ipa
      if-no-files-found: error
      retention-days: 30
